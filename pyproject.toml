[project]
name = "signvoice"
version = "0.1.0"
description = "SignVoice: LSM sign recognition converted to speech (Group 11)"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=2,<3",
    "torch>=2.6",
    "mediapipe>=0.10",
    "opencv-python>=4.10",
    "gradio>=5",
    "pyttsx3>=2.9",
    "typer>=0.12",
    "pyyaml>=6",
    "matplotlib>=3.9",
    "piper-tts>=1.3",
]

[project.scripts]
g11 = "g11.__main__:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g11"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100

[tool.ty]
environment = { python-version = "3.11" }

[tool.ty.rules]
# Third-party libs without type stubs (mediapipe, pyttsx3): do not block on
# calls whose signature cannot be checked.
call-to-function-with-unknown-signature = "ignore"
unknown-argument = "ignore"
