[project]
name = "signvoice"
version = "0.1.0"
description = "SignVoice: LSM sign recognition converted to speech (Group 11)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "gradio>=5",
  "matplotlib>=3.9",
  "mediapipe>=0.10",
  "numpy>=2,<3",
  "opencv-python>=4.10",
  "piper-tts>=1.3",
  "pyttsx3>=2.9",
  "pyyaml>=6",
  "torch>=2.6",
  "typer>=0.12",
]

[project.scripts]
g11 = "g11.__main__:run"

[dependency-groups]
dev = [
  "pytest>=9.2.0",
  "ruff>=0.17.5",
  "tombi>=1.11",
  "ty>=0.0.104",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/g11", "src/data", "src/features", "src/language", "src/model", "src/vision"]

[tool.ruff]
line-length = 100

[tool.ty]
environment = { python-version = "3.11" }

[tool.ty.rules]
# Third-party libs without type stubs (mediapipe, pyttsx3): do not block on
# calls whose signature cannot be checked.
call-to-function-with-unknown-signature = "ignore"
unknown-argument = "ignore"
